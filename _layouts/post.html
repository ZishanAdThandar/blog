---
layout: default
---

{% assign cat = page.categories | first %}
{% assign cat_page = site.pages | where: "category", cat | first %}
{% assign post_pos = 2 %}
{% if cat_page %}{% assign post_pos = 3 %}{% endif %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}{{ site.baseurl }}/"
    }
    {% if cat_page %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ cat_page.title | jsonify }},
      "item": "{{ site.url }}{{ site.baseurl }}{{ cat_page.url }}"
    }
    {% endif %},
    {
      "@type": "ListItem",
      "position": {{ post_pos }},
      "name": {{ page.title | jsonify }},
      "item": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
    }
  ]
}
</script>

{{ content }}
